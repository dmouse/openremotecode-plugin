name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned to the version the integration tests assert against
      # (test/support/opencode-project-fixture.mjs OPENCODE_VERSION).
      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.30
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
