name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # OpenCode is published to npm, and installed here rather than put on PATH.
      #
      # @opencode/cli's postinstall resolves the platform binary at install time;
      # the linux-x64 package it would land on is depended on directly instead, so
      # the step needs no install scripts and pins exactly what it runs. The plugin
      # deliberately depends on no OpenCode package (ADR 0013), so the client the
      # test drives the real server through is installed here too rather than as a
      # workspace devDependency.
      #
      # Pinned to the version ADR 0013 verified the adapter against.
      - name: Install OpenCode and its client for the integration test
        run: |
          mkdir -p "$HOME/opencode"
          cd "$HOME/opencode"
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund \
            @opencode/cli-linux-x64@2.0.12 @opencode/client@2.0.12
          echo "OPENCODE_TEST_BINARY=$HOME/opencode/node_modules/@opencode/cli-linux-x64/bin/opencode" >> "$GITHUB_ENV"
          echo "OPENCODE_CLIENT=$HOME/opencode/node_modules/@opencode/client/dist/promise/index.js" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # OPENCODE_TEST_BINARY and OPENCODE_CLIENT are set above, so
      # test/integration/opencode-connector.test.mjs runs rather than skipping.
      - name: Test
        run: pnpm run test
